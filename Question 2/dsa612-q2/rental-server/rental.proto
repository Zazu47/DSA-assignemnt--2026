syntax = "proto3";

package rental;

service RentalService {
    rpc addProperty (AddPropertyRequest) returns (AddPropertyResponse);
    rpc createUsers (stream UserProfile) returns (CreateUsersResponse);
    rpc updateProperty (UpdatePropertyRequest) returns (RentalProperty);
    rpc removeProperty (RemovePropertyRequest) returns (RemovePropertyResponse);
    rpc listAvailableProperties (ListPropertiesRequest) returns (stream RentalProperty);
    rpc searchProperty (SearchPropertyRequest) returns (SearchPropertyResponse);
    rpc bookProperty (BookPropertyRequest) returns (BookPropertyResponse);
    rpc confirmBooking (ConfirmBookingRequest) returns (ConfirmBookingResponse);
}

message RentalProperty {
    string property_id = 1;
    string property_name = 2;
    string location = 3;
    string property_type = 4;
    double price_per_night = 5;
    string status = 6;
    string host_id = 7;
}

message AddPropertyRequest {
    string property_name = 1;
    string location = 2;
    string property_type = 3;
    double price_per_night = 4;
    string status = 5;
    string host_id = 6;
}

message AddPropertyResponse {
    string property_id = 1;
    string message = 2;
}

message UpdatePropertyRequest {
    string property_id = 1;
    string host_id = 2;
    optional string property_name = 3;
    optional string location = 4;
    optional string property_type = 5;
    optional double price_per_night = 6;
    optional string status = 7;
}

message RemovePropertyRequest {
    string property_id = 1;
    string host_id = 2;
}

message RemovePropertyResponse {
    repeated RentalProperty available_properties = 1;
    string message = 2;
}

message UserProfile {
    string user_id = 1;
    string username = 2;
    string email = 3;
    string role = 4;
}

message CreateUsersResponse {
    int32 total_created = 1;
    string message = 2;
}

message ListPropertiesRequest {
    optional string location = 1;
    optional double min_price = 2;
    optional double max_price = 3;
}

message SearchPropertyRequest {
    string property_id = 1;
}

message SearchPropertyResponse {
    bool found = 1;
    string message = 2;
    optional RentalProperty property = 3;
}

message BookPropertyRequest {
    string guest_id = 1;
    string property_id = 2;
    string check_in_date = 3;
    string check_out_date = 4;
}

message BookPropertyResponse {
    string booking_ref = 1;
    double estimated_total = 2;
    string message = 3;
}

message ConfirmBookingRequest {
    string guest_id = 1;
    string booking_ref = 2;
}

message ConfirmBookingResponse {
    bool confirmed = 1;
    string booking_id = 2;
    double total_cost = 3;
    int32 number_of_nights = 4;
    string message = 5;
}